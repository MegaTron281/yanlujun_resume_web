<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">双电机视觉云台系统框图 / Dual-motor visual pan-tilt system architecture</title>
  <desc id="diagram-desc">K230 从摄像头图像计算双轴目标角速度，经 UART 传给 STM32H723。STM32H723 融合 BMI088 测量反馈，通过 CAN 控制偏航和俯仰电机。K230 computes two-axis target rates from camera images and sends them over UART to the STM32H723, which uses BMI088 feedback to control yaw and pitch motors over CAN.</desc>
  <defs>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#bdac92"/></pattern>
    <marker id="ink-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#352c25"/></marker>
    <marker id="return-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#bd634c"/></marker>
    <marker id="sense-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#5d866f"/></marker>
    <style>
      .paper{fill:#fbf8f1}.ink{fill:#352c25}.muted{fill:#675b50}
      .cut{stroke:#352c25;stroke-width:2.5;stroke-linejoin:round}
      .rule{fill:none;stroke:#352c25;stroke-width:2}
      .wire{fill:none;stroke:#352c25;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#ink-arrow)}
      .return{fill:none;stroke:#bd634c;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#return-arrow)}
      .sense{fill:none;stroke:#5d866f;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#sense-arrow)}
      .eyebrow{font:800 18px -apple-system,BlinkMacSystemFont,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;letter-spacing:2px;fill:#352c25}
      .title{font:800 46px -apple-system,BlinkMacSystemFont,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#352c25}
      .subtitle{font:600 21px Georgia,serif;fill:#675b50}
      .section{font:800 23px -apple-system,BlinkMacSystemFont,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#352c25}
      .section-en{font:600 17px Georgia,serif;fill:#675b50}
      .box-title{font:800 22px -apple-system,BlinkMacSystemFont,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#352c25}
      .box-en{font:600 17px Georgia,serif;fill:#675b50}
      .detail{font:600 17px -apple-system,BlinkMacSystemFont,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#4d4239}
      .detail-en{font:600 16px Georgia,serif;fill:#675b50}
      .note{font:600 16px -apple-system,BlinkMacSystemFont,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#675b50}
      .note-en{font:600 16px Georgia,serif;fill:#675b50}
    </style>
  </defs>

  <rect class="paper" width="1600" height="1120"/>
  <rect x="29" y="27" width="1542" height="1065" fill="none" stroke="#352c25" stroke-width="3"/>
  <rect x="1344" y="31" width="194" height="99" fill="url(#dots)"/>
  <path d="M51 28 L182 28 L177 52 L57 52 Z" fill="#ecd9ad" transform="rotate(-4 117 40)"/>
  <text class="eyebrow" x="72" y="92">CONTROL / 02</text>
  <text class="title" x="72" y="145">双电机视觉云台 · 系统架构</text>
  <text class="subtitle" x="74" y="177">Dual-motor visual pan-tilt · System architecture</text>
  <path class="rule" d="M72 197 H1528"/>

  <!-- K230：视觉与人机交互 / Vision and interaction -->
  <path class="cut" d="M63 225 L538 222 L535 952 L60 950 Z" fill="#efe2c9"/>
  <path d="M106 214 L226 217 L225 240 L105 238 Z" fill="#e6c980" transform="rotate(-3 165 226)"/>
  <text class="section" x="84" y="262">01  视觉与交互</text>
  <text class="section-en" x="276" y="261">Vision / interaction</text>

  <rect class="cut" x="86" y="302" width="200" height="121" fill="#f8f4ec"/>
  <text class="box-title" x="104" y="338">摄像头</text>
  <text class="box-en" x="104" y="365">Camera</text>
  <text class="detail" x="104" y="395">640 × 480</text>

  <rect class="cut" x="312" y="302" width="200" height="121" fill="#d9e6dc"/>
  <text class="box-title" x="330" y="338">触摸屏 / 按键</text>
  <text class="box-en" x="330" y="365">Touchscreen / keys</text>
  <text class="detail" x="330" y="393">模式与使能</text>
  <text class="detail-en" x="330" y="414">Mode / enable</text>

  <rect class="cut" x="86" y="479" width="426" height="124" fill="#f8f4ec"/>
  <text class="box-title" x="106" y="515">追踪目标</text>
  <text class="box-en" x="106" y="541">Tracking targets</text>
  <text class="detail" x="106" y="568">CAM · 矩形 · 色块 · 人脸</text>
  <text class="detail-en" x="106" y="592">CAM · rectangle · color blob · face</text>

  <rect class="cut" x="86" y="670" width="426" height="176" fill="#efcabb"/>
  <text class="box-title" x="106" y="708">视觉外环</text>
  <text class="box-en" x="106" y="736">Vision outer loop</text>
  <text class="detail" x="106" y="774">像素误差 → 平滑 / 死区 → 目标角速度</text>
  <text class="detail-en" x="106" y="807">Pixel error → smoothing / deadband</text>
  <text class="detail-en" x="106" y="832">→ target angular rates</text>

  <path class="wire" d="M186 423 V479"/>
  <path class="wire" d="M412 423 V479"/>
  <path class="wire" d="M299 603 V670"/>

  <!-- UART：双向协议 / Bidirectional protocol -->
  <path class="cut" d="M563 224 L944 226 L941 951 L560 949 Z" fill="#f2e1d5"/>
  <path d="M706 214 L823 214 L830 239 L708 238 Z" fill="#ecd9ad" transform="rotate(3 768 226)"/>
  <text class="section" x="581" y="262">02  双向通信</text>
  <text class="section-en" x="757" y="261">UART link</text>

  <rect class="cut" x="582" y="331" width="342" height="413" fill="#f8f4ec"/>
  <text class="box-title" x="607" y="368">UART 控制帧</text>
  <text class="box-en" x="607" y="395">UART control frames</text>
  <path class="rule" d="M607 413 H899"/>
  <text class="detail" x="607" y="449">K230 UART2 ↔ STM32 USART10</text>
  <text class="detail" x="607" y="498">115200 · 9 字节帧 · CRC</text>
  <text class="detail-en" x="607" y="524">115200 baud · 9-byte frame · CRC</text>
  <text class="detail" x="607" y="579">目标角速度 / 使能 / 失能</text>
  <text class="detail-en" x="607" y="605">Target rates / enable / disable</text>
  <text class="detail" x="607" y="663">ACK 确认收到控制帧</text>
  <text class="detail-en" x="607" y="689">ACK confirms frame receipt</text>

  <!-- STM32H723：反馈与双电机控制 / Feedback and motor control -->
  <path class="cut" d="M970 225 L1538 223 L1542 951 L968 949 Z" fill="#dce7df"/>
  <path d="M1356 214 L1477 217 L1473 240 L1356 238 Z" fill="#d7dfc7" transform="rotate(3 1416 227)"/>
  <text class="section" x="990" y="262">03  实时控制</text>
  <text class="section-en" x="1173" y="261">Real-time motor control</text>

  <rect class="cut" x="990" y="300" width="520" height="120" fill="#f8f4ec"/>
  <text class="box-title" x="1012" y="336">STM32H723 · 串口接收与协议解析</text>
  <text class="box-en" x="1012" y="365">UART reception / protocol parsing</text>
  <text class="detail" x="1012" y="393">CRC 校验 · 目标速度解码 · 使能状态</text>
  <text class="detail-en" x="1012" y="414">CRC check · target rates · enable state</text>

  <rect class="cut" x="990" y="477" width="245" height="132" fill="#d6e4e5"/>
  <text class="box-title" x="1012" y="514">BMI088</text>
  <text class="box-en" x="1012" y="541">IMU feedback</text>
  <text class="detail" x="1012" y="570">陀螺仪 / 加速度计</text>
  <text class="detail-en" x="1012" y="596">Gyro / accelerometer</text>

  <rect class="cut" x="1265" y="477" width="245" height="132" fill="#f8f4ec"/>
  <text class="box-title" x="1287" y="514">姿态估计</text>
  <text class="box-en" x="1287" y="541">Attitude estimate</text>
  <text class="detail" x="1287" y="570">世界系偏航角速度</text>
  <text class="detail-en" x="1287" y="596">World-frame yaw rate</text>

  <rect class="cut" x="990" y="682" width="245" height="132" fill="#f3cf9b"/>
  <text class="box-title" x="1012" y="719">偏航速度环</text>
  <text class="box-en" x="1012" y="746">Yaw speed loop</text>
  <text class="detail" x="1012" y="775">Vx − 测量速度 → PID</text>
  <text class="detail-en" x="1012" y="801">Vx − measured rate → PID</text>

  <rect class="cut" x="1265" y="682" width="245" height="132" fill="#f3cf9b"/>
  <text class="box-title" x="1287" y="719">俯仰速度通道</text>
  <text class="box-en" x="1287" y="746">Pitch speed channel</text>
  <text class="detail" x="1287" y="775">Vy → MIT 速度指令</text>
  <text class="detail-en" x="1287" y="801">Vy → MIT speed command</text>

  <rect class="cut" x="990" y="848" width="245" height="72" fill="#f8f4ec"/>
  <text class="box-title" x="1012" y="879">偏航电机</text>
  <text class="box-en" x="1012" y="906">Yaw motor · CAN 0x01</text>
  <rect class="cut" x="1265" y="848" width="245" height="72" fill="#f8f4ec"/>
  <text class="box-title" x="1287" y="879">俯仰电机</text>
  <text class="box-en" x="1287" y="906">Pitch motor · CAN 0x02</text>

  <!-- 信号按模块间的纸缝走线 / Route signals through gaps between cards -->
  <path class="wire" d="M512 757 H548 V540 H582"/>
  <path class="wire" d="M924 384 H990"/>
  <path class="return" d="M1018 420 V451 H956 V662 H924"/>
  <text class="note" x="946" y="645" fill="#bd634c">ACK</text>
  <path class="wire" d="M1008 420 H978 V729 H990"/>
  <path class="wire" d="M1493 420 H1525 V729 H1510"/>
  <path class="sense" d="M1235 543 H1265"/>
  <path class="sense" d="M1387 609 V642 H1112 V682"/>
  <path class="wire" d="M1112 814 V848"/>
  <path class="wire" d="M1387 814 V848"/>

  <path class="rule" d="M72 985 H1528" stroke-dasharray="7 7"/>
  <text class="note" x="74" y="1023">电机带动云台，摄像头在下一帧重新测量目标；绿色连线表示 IMU 测量反馈。</text>
  <text class="note-en" x="74" y="1054">The motors move the pan-tilt unit; the next camera frame closes the loop. Green lines show IMU feedback.</text>
</svg>
